name: Build desktop packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node scripts/validate-tag.mjs
  linux:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm zsync zstd ruby ruby-dev build-essential libgtk-3-0t64 libnss3 libasound2t64
          sudo gem install fpm --version 1.17.0 --no-document
      - run: npm ci
      - name: Configure sandbox helper on the disposable Linux runner
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm run check
      - run: npm run test:smoke
      - name: Package Linux
        run: npx --no-install electron-builder --linux AppImage deb rpm pacman tar.gz --${{ matrix.arch }} --publish never
        env:
          USE_SYSTEM_FPM: 'true'
      - run: node scripts/collect.mjs linux ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-linux-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  flatpak:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install Flatpak build tools and runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08
      - run: npm ci
      - run: npm run build
      - run: npx --no-install electron-builder --linux flatpak --${{ matrix.arch }} --publish never
      - run: node scripts/collect.mjs flatpak ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-flatpak-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  macos:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
          - arch: universal
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:smoke
      - run: npx --no-install electron-builder --mac dmg --${{ matrix.arch }} --publish never
      - run: node scripts/collect.mjs macos ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-macos-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  windows:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:smoke
      - run: npx --no-install electron-builder --win nsis zip --${{ matrix.arch }} --publish never
      - name: Install WiX for native-architecture MSI
        run: dotnet tool install --tool-path .wix wix --version 6.0.2
      - run: node scripts/windows-msi.mjs ${{ matrix.arch }}
      - run: node scripts/collect.mjs windows ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-windows-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  draft-release:
    if: github.ref_type == 'tag'
    needs: [linux, flatpak, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: packages-*
          path: artifacts
          merge-multiple: true
      - run: node scripts/release-check.mjs artifacts
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Rattib Desktop $GITHUB_REF_NAME" --notes-file docs/release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" artifacts/Rattib-Desktop-* artifacts/SHA256SUMS --clobber
